<!DOCTYPE html>
<html>
<head>
    <title>Registro</title>
</head>
<body>

<h2>Registrar Usuario</h2>

<form method="POST">

        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Usuario"
               required>

        <br><br>

        <input type="email"
               name="email"
               placeholder="Correo"
               required>

        <br><br>

        <input type="password"
               name="password"
               placeholder="Contraseña"
               required>
        <html>

        <br><br>

        <button type="submit">
        Registrarse
        </button>

</form>

{% for message in messages %}
    <p style="color:red;">
        {{ message }}
    </p>
{% endfor %}

</body>
</html>

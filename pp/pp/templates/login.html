<!DOCTYPE html>
<html lang="es">

{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background-image:url("{% static 'fondo.jpg' %}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:Arial, sans-serif;
        }

        form{
            background:rgba(0,0,0,0.75);
            padding:35px;
            border-radius:15px;
            width:350px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.5);
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
            font-size:15px;
        }

        .btn-login{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#00cc99;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#00aa77;
        }

        .btn-register{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#3498db;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .btn-register:hover{
            background:#2980b9;
        }

        p{
            text-align:center;
            margin-top:10px;
        }

        a{
            text-decoration:none;
        }

    </style>

</head>

<body>

    <form method="POST">

        <h2>Iniciar Sesión</h2>

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Usuario"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required
        >

        <button type="submit" class="btn-login">
            Entrar
        </button>

        <a href="/register/">
            <button type="button" class="btn-register">
                Registrarse
            </button>
        </a>

        {% for message in messages %}
            <p style="color:red;">
                {{ message }}
            </p>
        {% endfor %}

    </form>

</body>
</html>
